# Persona swap: the tasks that have a different-persona variant, run with the swapped persona; the
# original-persona rows are the tool_agent base runs of baselines_local_v2. Pair with
#   lab compare runs/baselines_local_v2 runs/persona_swap_local --filter-a condition=tool_agent
name: persona_swap_local
model: qwen2.5:7b-instruct
adapter: openai_compatible
adapter_params: {base_url: "http://127.0.0.1:11434/v1", max_tokens: 900}
tasks: [all]
variants: [other_student, quick_hint_student]
seeds: [0, 1, 2]
max_steps: 25
conditions:
  tool_agent: {memory_access: tools, tool_profile: full}
