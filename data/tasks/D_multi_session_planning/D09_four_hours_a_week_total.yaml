seeds: [0]
max_steps: 25
variants:
  - id: on_call_cancelled
    condition: correct_memory
    description: a newer note says the on-call fortnight is off — the usual daily rule alone applies
    expected_delta: no weekly cap; the normal planner allocation is fine
    patch:
      memory_add:
        - {memory_kind: update, text: "On-call is off — they found cover. Plan normally, usual daily rules.", stated_at: "2026-11-02T09:00:00", session_id: s5, scope: global, payload: {key: weekly_cap_minutes, value: null}}
    checks_remove: [weekly_cap_kept, mentions_the_cap, word_problems_first]
    checks_add:
      - {id: reaches_target, description: every diagnostic skill reaches 0.5, verifier: plan.reaches_target, params: {goal: {assessment_id: diag_retake, target_knowledge: 0.5}, mastery_from: initial}, weight: 2, capability: personalized_planning}
      - {id: no_phantom_cap, description: the summary does not apply the cancelled cap, verifier: trajectory.final_not_mentions, params: {none_of: ["four hours a week", "4 hours a week", "on-call cap", "on call cap"]}, weight: 1, capability: cross_session_consistency}
    reference_path:
      - {action: tool_call, tool: get_preferences}
      - {action: tool_call, tool: search_memory, args: {query: "on call cap week"}}
      - {action: tool_call, tool: get_calendar_events, args: {start: "2026-11-02T00:00:00", end: "2026-11-21T00:00:00"}}
      - {action: plan_for, assessment_id: diag_retake, skill_ids: [word_prob, functions, graph_lines, quadratics, systems], target_knowledge: 0.5, title: "Diagnostic prep (on-call off)", goal: "Every diagnostic skill to 0.5 by Nov 20"}
      - {action: final, message: "On-call is off, per your note this morning, so this is the normal plan: one skill per block with breaks, lunch and evenings around the gym, up to 90 minutes a day, finishing twelve hours before the diagnostic on the 20th."}
  - id: no_memory
    condition: no_memory
    description: the note and the rules are gone; the agent must ask
    expected_delta: the agent asks and learns the cap from the answer
    checks_remove: [read_memory]
    checks_add:
      - {id: asked_first, description: at least one question, verifier: trajectory.asked_user, weight: 1, capability: proactive_behavior}
