negative_cases:
  - id: replaces_the_plan
    description: creates a fresh plan instead of extending, dropping the done blocks
    actions:
      - {type: tool_call, tool: get_preferences, args: {}}
      - {type: tool_call, tool: create_study_plan, args: {title: "New plan", goal: "quiz", target_date: "2026-11-13T09:00:00", blocks: [
          {start: "2026-11-04T19:30:00", end: "2026-11-04T20:00:00", skill_ids: [quadratics]},
          {start: "2026-11-05T19:30:00", end: "2026-11-05T20:00:00", skill_ids: [quadratics]},
          {start: "2026-11-06T06:30:00", end: "2026-11-06T07:00:00", skill_ids: [quadratics]},
          {start: "2026-11-09T19:30:00", end: "2026-11-09T20:00:00", skill_ids: [quadratics]}]}}
      - {type: final, message: "Made a new plan through the quiz."}
    expect_fail_checks: [same_plan_extended, used_update_not_create, updated]
