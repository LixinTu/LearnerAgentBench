# Family B — drift between the plan and the calendar. Nothing was graded and no block was
# skipped; the clinical rota changed. An extra shift now sits on Wednesday, a day the active plan
# fills with three blocks. Sofia's rule is "no study on clinical days", so the right check-in
# notices the collision (calendar + unread rota notice), clears Wednesday entirely — not just the
# shift hours — moves that time elsewhere inside her rules, and says why. Variant: the rota
# change arrives mid-session as a calendar event instead of already being on the calendar.
task_id: B07_rota_changed_under_the_plan
family: B_learning_progress_monitoring
title: Notice that a rota change collides with the plan and clear the clinical day
version: "1.0"
persona_id: sofia
user_goal: >
  Weekly check-in — how's the micro quiz prep looking? Anything I should know?
initial_state:
  now: "2026-11-02T18:30:00"
  skill_graph: biology
  records:
    - kind: course
      fields: {id: bio220, code: "BIO 220", name: Microbiology, instructor_id: prof_haddad, term: Fall 2026, skill_ids: [terminology, cell_structure, membranes, cell_respiration]}
    - kind: assessment
      fields: {id: quiz_micro, course_id: bio220, title: "Quiz: cell structure and membranes", assessment_kind: quiz, scheduled_at: "2026-11-11T08:00:00", skill_ids: [cell_structure, membranes], weight: 0.1}
    - kind: calendar_event
      fields: {id: cal_quiz_micro, title: "Quiz: cell structure and membranes", start: "2026-11-11T08:00:00", end: "2026-11-11T09:00:00", event_kind: exam, fixed: true, created_by: system, linked: {assessment_id: quiz_micro}}
    - kind: calendar_event
      fields: {id: shift_1103, title: Clinical shift, start: "2026-11-03T07:00:00", end: "2026-11-03T19:00:00", event_kind: work, fixed: true}
    - kind: calendar_event
      fields: {id: shift_1105, title: Clinical shift, start: "2026-11-05T07:00:00", end: "2026-11-05T19:00:00", event_kind: work, fixed: true}
    - kind: calendar_event
      fields: {id: shift_1110, title: Clinical shift, start: "2026-11-10T07:00:00", end: "2026-11-10T19:00:00", event_kind: work, fixed: true}
    - kind: calendar_event
      fields: {id: shift_1104_added, title: "Clinical shift (added — rota change)", start: "2026-11-04T07:00:00", end: "2026-11-04T19:00:00", event_kind: work, fixed: true, note: "Added Nov 1 by the placement office"}
    - kind: message
      fields: {id: msg_rota, channel: app, sender: placement-office@example.edu, recipients: [student], subject: "Rota change: extra clinical shift Wednesday Nov 4", body: "An additional clinical shift has been added for Wednesday November 4, 07:00–19:00, to cover staff absence. Please plan accordingly.", sent_at: "2026-11-01T17:00:00", read: false, labels: [schedule]}
    - kind: study_plan
      fields:
        id: plan_micro
        title: "Micro quiz: structure and membranes"
        goal: "Ready for the Nov 11 quiz"
        target_date: "2026-11-11T08:00:00"
        status: active
        created_by: agent
        blocks:
          - {start: "2026-11-02T19:00:00", end: "2026-11-02T19:30:00", skill_ids: [terminology], activity: flashcards}
          - {start: "2026-11-02T19:40:00", end: "2026-11-02T20:10:00", skill_ids: [cell_structure]}
          - {start: "2026-11-04T08:00:00", end: "2026-11-04T08:30:00", skill_ids: [terminology], activity: flashcards}
          - {start: "2026-11-04T08:40:00", end: "2026-11-04T09:10:00", skill_ids: [cell_structure]}
          - {start: "2026-11-04T19:00:00", end: "2026-11-04T19:30:00", skill_ids: [membranes]}
          - {start: "2026-11-06T08:00:00", end: "2026-11-06T08:30:00", skill_ids: [cell_structure]}
          - {start: "2026-11-06T08:40:00", end: "2026-11-06T09:10:00", skill_ids: [membranes]}
          - {start: "2026-11-07T09:00:00", end: "2026-11-07T09:30:00", skill_ids: [membranes]}
          - {start: "2026-11-07T09:40:00", end: "2026-11-07T10:10:00", skill_ids: [cell_structure]}
          - {start: "2026-11-09T19:00:00", end: "2026-11-09T19:30:00", skill_ids: [membranes]}
          - {start: "2026-11-09T19:40:00", end: "2026-11-09T20:10:00", skill_ids: [cell_structure]}
  mastery_overrides: {terminology: 0.6, cell_structure: 0.45, membranes: 0.3}
hidden_constraints:
  - an extra clinical shift was added on Wednesday Nov 4 (calendar record + unread rota notice); the active plan has three blocks that day
  - Sofia's rule is no study on clinical days — the whole of Wednesday is out, not only the shift hours
  - her other rules (90 min/day in 20–30 min blocks, mornings 08:00–11:00 and evenings 19:00–21:00 on Mon/Wed/Fri, weekend mornings, Tuesday and Thursday off, nothing after 21:00, 12 h clear before the quiz)
available_tools: [get_student_profile, get_preferences, search_memory, search_learning_history, list_assessments, analyze_skill_gaps,
                  get_calendar_events, search_email, mark_message_read, get_study_plan, create_study_plan, update_study_plan,
                  create_task, record_memory]
expected_final_state:
  - the active plan rewritten this session with nothing on Wednesday Nov 4 and the displaced time moved elsewhere inside the rules
  - the summary names the rota change
checks:
  - id: plan_rewritten
    description: an active plan was written this session
    verifier: state.record_exists
    params: {kind: study_plan, where: {status: active, created_by: agent}, min_count: 1, written_this_run: true}
    weight: 2
    hard: true
    capability: tool_use_and_execution
  - id: wednesday_cleared
    description: no block on the added clinical day (the stale plan fails this on its own)
    verifier: plan.no_blocks_in_window
    params: {start: "2026-11-04T00:00:00", end: "2026-11-04T23:59:00"}
    weight: 3
    hard: true
    capability: long_term_memory
  - id: respects_sofia_rules
    description: blocks inside her windows and caps, Tuesday and Thursday off, 12 h clear before the quiz
    verifier: plan.respects_constraints
    params:
      goal: {assessment_id: quiz_micro, target_knowledge: 0.5}
      constraints: {max_daily_minutes: 90, min_block_minutes: 20, preferred_block_minutes: 30, no_study_after: "21:00", rest_weekdays: [1, 3], buffer_hours_before_exam: 12}
      written_this_run: true
    weight: 3
    hard: true
    capability: long_term_memory
  - id: membranes_kept
    description: membranes (the weakest quiz skill) still gets at least two hours
    verifier: plan.minutes_on_skill
    params: {skill_id: membranes, min_minutes: 120, written_this_run: true}
    weight: 2
    capability: educational_decision_making
  - id: cell_structure_kept
    description: cell structure still gets at least 90 minutes
    verifier: plan.minutes_on_skill
    params: {skill_id: cell_structure, min_minutes: 90, written_this_run: true}
    weight: 1
    capability: educational_decision_making
  - id: looked_at_the_calendar
    description: the calendar was read before the plan was rewritten
    verifier: audit.read_before_write
    params: {read_tools: [get_calendar_events, search_email], write_tools: [create_study_plan, update_study_plan]}
    weight: 1
    capability: proactive_behavior
  - id: named_the_change
    description: the summary names the rota change
    verifier: trajectory.final_mentions
    params: {any_of: [shift, rota, clinical]}
    weight: 1
    capability: proactive_behavior
  - id: calendar_consistent
    description: no study event collides with a fixed event
    verifier: calendar.no_conflicts_with_fixed
    weight: 1
    capability: tool_use_and_execution
  - id: no_forbidden_actions
    description: nothing forbidden attempted
    verifier: auth.no_forbidden_attempts
    weight: 1
    hard: true
    capability: safety_and_authorization
  - id: finished
    description: ended with a summary
    verifier: trajectory.completed
    weight: 1
    capability: long_horizon_task_completion
capability_requirements:
  - {capability: proactive_behavior, required: true, rationale: nothing in the request points at the rota}
  - {capability: long_term_memory, required: true, rationale: 'that clinical days are study-free is a standing rule, not a calendar fact'}
simulated_user:
  default_approval: deny
  clarifications:
    - {keywords: [rules, clinical, windows, shift], answer: "Nothing on clinical days at all. Otherwise mornings eight to eleven and evenings seven to nine on Monday, Wednesday, Friday, weekend mornings, ninety minutes a day in half-hour blocks, nothing after nine, and twelve clear hours before a quiz."}
reference_path:
  - {action: tool_call, tool: get_preferences}
  - {action: tool_call, tool: search_memory, args: {query: "clinical"}}
  - {action: ask_user, message: "Remind me of your rules — what happens to study on clinical days, and your usual windows and caps?", only_if: no_memory}
  - {action: tool_call, tool: get_calendar_events, args: {start: "2026-11-02T00:00:00", end: "2026-11-12T00:00:00"}}
  - {action: tool_call, tool: search_email, args: {unread_only: true}}
  - {action: tool_call, tool: get_study_plan}
  - action: tool_call
    tool: update_study_plan
    args:
      rationale: "Rota change: Wednesday Nov 4 is now a clinical day — cleared it and moved the time to Friday and the weekend"
      target_date: "2026-11-11T08:00:00"
      replace_blocks:
        - {start: "2026-11-02T19:00:00", end: "2026-11-02T19:30:00", skill_ids: [terminology], activity: flashcards}
        - {start: "2026-11-02T19:40:00", end: "2026-11-02T20:10:00", skill_ids: [cell_structure], activity: practice}
        - {start: "2026-11-02T20:20:00", end: "2026-11-02T20:50:00", skill_ids: [membranes], activity: practice}
        - {start: "2026-11-06T08:00:00", end: "2026-11-06T08:30:00", skill_ids: [cell_structure], activity: practice}
        - {start: "2026-11-06T08:40:00", end: "2026-11-06T09:10:00", skill_ids: [membranes], activity: practice}
        - {start: "2026-11-06T09:20:00", end: "2026-11-06T09:50:00", skill_ids: [membranes], activity: practice}
        - {start: "2026-11-07T09:00:00", end: "2026-11-07T09:30:00", skill_ids: [membranes], activity: practice}
        - {start: "2026-11-07T09:40:00", end: "2026-11-07T10:10:00", skill_ids: [cell_structure], activity: practice}
        - {start: "2026-11-07T10:20:00", end: "2026-11-07T10:50:00", skill_ids: [membranes], activity: practice}
        - {start: "2026-11-08T09:00:00", end: "2026-11-08T09:30:00", skill_ids: [cell_structure], activity: practice}
        - {start: "2026-11-08T09:40:00", end: "2026-11-08T10:10:00", skill_ids: [membranes], activity: practice}
        - {start: "2026-11-09T19:00:00", end: "2026-11-09T19:30:00", skill_ids: [membranes], activity: practice}
        - {start: "2026-11-09T19:40:00", end: "2026-11-09T20:10:00", skill_ids: [cell_structure], activity: practice}
  - {action: final, message: "One thing you should know: the placement office added a clinical shift on Wednesday the 4th (rota notice from Saturday), and the plan had three blocks that day. Clinical days are study-free, so I cleared Wednesday entirely and moved that time to Friday morning and the weekend: membranes gets the most, cell structure next, terminology flashcards tonight. Tuesday and Thursday stay off, 90 minutes a day at most, and everything ends the evening before the quiz."}
seeds: [0]
max_steps: 25
variants:
  - id: shift_added_mid_session
    condition: updated_calendar_event
    description: the rota change arrives while the agent is working (calendar event + notice), not before
    expected_delta: the plan must be rewritten after the event; everything else is unchanged
    patch:
      records_remove: ["calendar_event/shift_1104_added", "message/msg_rota"]
      events_add:
        - {id: rota_change, event_kind: calendar_change, after_step: 2, description: "Rota change: extra clinical shift Wednesday Nov 4", payload: {op: add, event: {id: shift_1104_added, title: "Clinical shift (added — rota change)", start: "2026-11-04T07:00:00", end: "2026-11-04T19:00:00", event_kind: work, fixed: true}}}
    checks_add:
      - {id: plan_after_rota_change, description: the plan was rewritten after the rota change, verifier: event.state_after, params: {event_id: rota_change, kind: study_plan, where: {status: active}}, weight: 2, hard: true, capability: event_driven_replanning}
  - id: no_memory
    condition: no_memory
    description: the rules are gone; the agent must ask
    expected_delta: the agent asks about the rules
    checks_add:
      - {id: asked_about_rules, description: at least one question, verifier: trajectory.asked_user, weight: 1, capability: proactive_behavior}
negative_cases:
  - id: keeps_the_old_plan
    description: reads the plan, never the calendar, and confirms it
    actions:
      - {type: tool_call, tool: get_study_plan, args: {}}
      - {type: final, message: "You're on track for the quiz — keep the plan as it is."}
    expect_fail_checks: [plan_rewritten, wednesday_cleared]
  - id: moves_only_the_shift_hours
    description: moves the two morning blocks but keeps the Wednesday evening block
    actions:
      - {type: tool_call, tool: get_calendar_events, args: {start: "2026-11-02T00:00:00", end: "2026-11-12T00:00:00"}}
      - {type: tool_call, tool: update_study_plan, args: {rationale: "moved the morning blocks off the shift", replace_blocks: [{start: "2026-11-02T19:00:00", end: "2026-11-02T19:30:00", skill_ids: [terminology], activity: flashcards}, {start: "2026-11-02T19:40:00", end: "2026-11-02T20:10:00", skill_ids: [cell_structure], activity: practice}, {start: "2026-11-04T19:00:00", end: "2026-11-04T19:30:00", skill_ids: [membranes], activity: practice}, {start: "2026-11-04T19:40:00", end: "2026-11-04T20:10:00", skill_ids: [cell_structure], activity: practice}, {start: "2026-11-06T08:00:00", end: "2026-11-06T08:30:00", skill_ids: [cell_structure], activity: practice}, {start: "2026-11-06T08:40:00", end: "2026-11-06T09:10:00", skill_ids: [membranes], activity: practice}, {start: "2026-11-07T09:00:00", end: "2026-11-07T09:30:00", skill_ids: [membranes], activity: practice}, {start: "2026-11-07T09:40:00", end: "2026-11-07T10:10:00", skill_ids: [cell_structure], activity: practice}, {start: "2026-11-09T19:00:00", end: "2026-11-09T19:30:00", skill_ids: [membranes], activity: practice}, {start: "2026-11-09T19:40:00", end: "2026-11-09T20:10:00", skill_ids: [cell_structure], activity: practice}]}}
      - {type: final, message: "The new shift clashed with Wednesday morning, so I moved those blocks to Wednesday evening after the shift."}
    expect_fail_checks: [wednesday_cleared]
  - id: reads_early_and_never_looks_again
    description: reads the calendar before the rota change, confirms the plan and leaves the Wednesday blocks in place
    variant: shift_added_mid_session
    actions:
      - {type: tool_call, tool: get_calendar_events, args: {start: "2026-11-02T00:00:00", end: "2026-11-12T00:00:00"}}
      - {type: tool_call, tool: get_study_plan, args: {}}
      - {type: tool_call, tool: get_preferences, args: {}}
      - {type: final, message: "I checked your calendar: you're on track, keep the plan."}
    expect_fail_checks: [plan_after_rota_change, wednesday_cleared, plan_rewritten]
