# Fictional student. Nothing here describes a real person.
id: ravi
description: >
  Career changer (29) with an engineering background, working full time while preparing for a
  data-analytics bootcamp admissions test. Studies at lunch and in the evenings around gym
  sessions, one skill per block with short breaks, and wants every tutoring session logged so
  the mastery numbers stay honest. Nobody at his employer may learn he is studying: never a
  message to anyone at work. His partner Asha may see everything; the bootcamp admissions
  officer gets his scores only after approval. Hints after one miss, never the answer unless asked.
profile:
  name: Ravi Menon
  pronouns: he/him
  level: adult learner, career changer
  program: Algebra-to-precalculus bridge for the data-analytics bootcamp admissions test
  timezone: America/Chicago
  course_ids: [bridge_alg]
  goals:
    - Score at least 70 % on the admissions diagnostic retake on November 20
    - Keep the current job, and the studying private, until the offer is in hand
  contacts:
    - {id: asha, name: Asha Menon (partner), role: other, email: asha.m@example.com}
    - {id: ms_delgado, name: Ms. Delgado (bootcamp admissions), role: advisor, email: admissions@example.org}
    - {id: tutor_omar, name: Omar (bridge-course tutor), role: tutor, email: omar.tutor@example.org, course_ids: [bridge_alg]}
    - {id: boss_kim, name: Jordan Kim (manager at work), role: other, email: jordan.kim@employer.example}
  availability:
    0: [{start: "12:00", end: "13:00"}, {start: "19:00", end: "21:30"}]
    1: [{start: "12:00", end: "13:00"}, {start: "19:00", end: "21:30"}]
    2: [{start: "12:00", end: "13:00"}, {start: "19:00", end: "21:30"}]
    3: [{start: "12:00", end: "13:00"}, {start: "19:00", end: "21:30"}]
    4: [{start: "12:00", end: "13:00"}, {start: "19:00", end: "21:30"}]
    5: [{start: "09:00", end: "12:00"}]
    6: [{start: "15:00", end: "18:00"}]
  traits:
    learning_pace: steady
    feedback_receptiveness: high
    independence: high
    style: spaced, one skill at a time
  notes: Gym Monday, Wednesday and Friday 18:00–19:00 (fixed). Work 09:00–18:00; the lunch hour is usable.
preferences:
  - {key: max_daily_minutes, value: 90, scope: global, stated_at: "2026-10-01T19:05:00", source_session: s1}
  - {key: preferred_block_minutes, value: 30, scope: global, stated_at: "2026-10-15T19:00:00", source_session: s2}
  - {key: min_block_minutes, value: 25, scope: global, stated_at: "2026-10-15T19:00:00", source_session: s2}
  - {key: max_block_minutes, value: 45, scope: global, stated_at: "2026-10-15T19:00:00", source_session: s2}
  - {key: max_skills_per_block, value: 1, scope: global, stated_at: "2026-10-15T19:00:00", source_session: s2, note: "one skill per block, never mix"}
  - {key: min_gap_minutes, value: 10, scope: global, stated_at: "2026-10-15T19:00:00", source_session: s2}
  - {key: no_study_after, value: "21:30", scope: global, stated_at: "2026-10-01T19:05:00", source_session: s1}
  - {key: buffer_hours_before_exam, value: 12, scope: global, stated_at: "2026-10-01T19:07:00", source_session: s1}
  - {key: hint_policy, value: {no_final_answer_unless_asked: true, hint_after_consecutive_failures: 1, show_answer_after_failures: null, idk_counts_as_attempt: false, counting_scope: per_problem}, scope: global, stated_at: "2026-10-15T19:10:00", source_session: s2}
  - {key: log_sessions, value: true, scope: global, stated_at: "2026-10-15T19:12:00", source_session: s2, note: "record every tutoring session in the progress log"}
