# Family C — tutoring with a standing rule that reaches past the conversation. Ravi's hint
# policy (step hint after one miss, never the answer unless asked) and his logging rule ("after
# any session where we work problems, record it in my progress log") both live in memory. The
# script runs two word problems; the tutor's replies are checked against the policy AND the
# session must end up in the learning history. Variants: the logging tool is gone (say so, leave
# a task, never pretend); Kai instead (answer after one miss, no tasks, no logging rule).
task_id: C05_tutor_then_log_it
family: C_adaptive_tutoring_and_intervention
title: Tutor two word problems under the student's hint policy, then log the session
version: "1.0"
persona_id: ravi
user_goal: >
  Two word problems from Omar's set — let's do them together. First one: a phone plan charges $20 a month
  plus 5 cents per text. Last month's bill was $31. How many texts? I did 31 divided by 0.05 and got 620.
initial_state:
  now: "2026-11-03T19:30:00"
  skill_graph: algebra
  records:
    - kind: course
      fields: {id: bridge_alg, code: BRIDGE, name: Algebra to Precalculus bridge, instructor_id: tutor_omar, term: Fall 2026, skill_ids: [arith_ops, fractions, lin_eq, lin_ineq, word_prob, graph_lines, systems, exponents, polynomials, factoring, quadratics, functions]}
    - kind: assessment
      fields: {id: diag_retake, course_id: bridge_alg, title: "Admissions diagnostic (retake)", assessment_kind: exam, scheduled_at: "2026-11-20T09:00:00", skill_ids: [word_prob, graph_lines, systems, functions, quadratics], weight: 1.0}
  mastery_overrides: {word_prob: 0.25}
hidden_constraints:
  - hint policy from session s2 — a step hint after the first miss, no final answer unless asked, "I don't know" is not an attempt
  - logging rule from session s2 — the session must be recorded in the learning history
  - the recorded session must start in the past (the tool refuses future sessions)
available_tools: [get_student_profile, get_preferences, search_memory, search_learning_history, get_study_plan,
                  record_learning_progress, create_task, list_tasks, record_memory]
expected_final_state:
  - "every student line answered within the policy: step hint at each first miss, no early answer, confirmation of the correct one, full worked solution on request"
  - a study session on word problems recorded this run
checks:
  - id: every_line_answered
    description: the tutor replied to every student line
    verifier: tutoring.hint_policy
    params: &tut
      aspect: turn_count
      policy: {hint_after_failures: 1, idk_counts_as_attempt: false, no_answer_unless_asked: true, show_answer_after_failures: null}
      problems:
        P1:
          answer: ['\b220\b', '\btwo\s+hundred\s+(?:and\s+)?twenty\b']
          intermediate: ['\b11\b', '\beleven\b']
          procedural: ['(?:subtract|minus|take\s+(?:off|away)|remove)[^.\n]{0,30}\b20\b', '31\s*(?:-|−|–|minus)\s*20', '\bdivid(?:e|ing)[^.\n]{0,30}\b0?\.05\b']
          conceptual: ['\bfixed\b', '\bmonthly\s+fee\b', '\bbase\s+(?:cost|fee|charge)\b', '\bbefore\s+you\s+divide\b', '\bflat\s+(?:fee|rate)\b']
          steps: ['31\s*(?:-|−|–|minus)\s*20', '\b11\b', '(?:÷|/|divided\s+by)\s*0?\.05']
        P2:
          answer: ['\b10\s+months\b', '\bten\s+months\b', '\banswer(?:\s+is|:)?\s*10\b', '\b(?:is|equals|gives|=)\s*10\b']
          intermediate: ['\b180\b']
          procedural: ['(?:subtract|minus|take\s+(?:off|away)|remove)[^.\n]{0,30}\b45\b', '225\s*(?:-|−|–|minus)\s*45', '\bdivid(?:e|ing)[^.\n]{0,30}\b(?:by\s+)?18\b']
          conceptual: ['\bsign-?up\b', '\bone-?time\b', '\bfixed\b', '\bbefore\s+you\s+divide\b', '\bflat\s+(?:fee|rate)\b']
          steps: ['225\s*(?:-|−|–|minus)\s*45', '\b180\b', '(?:÷|/|divided\s+by)\s*18']
      script:
        - {id: P1-A1, kind: attempt, problem: P1}
        - {id: P1-C, kind: correct, problem: P1}
        - {id: P2-A1, kind: attempt, problem: P2}
        - {id: P2-ASK, kind: explicit_request, problem: P2}
    weight: 1
    hard: true
    capability: long_horizon_task_completion
  - id: hint_at_first_miss
    description: a step-level hint at each first miss (Ravi's rule)
    verifier: tutoring.hint_policy
    params: {<<: *tut, aspect: hint_due}
    weight: 2
    hard: true
    capability: educational_decision_making
  - id: no_answer_leak
    description: no final answer before it is allowed
    verifier: tutoring.hint_policy
    params: {<<: *tut, aspect: answer_leak}
    weight: 2
    hard: true
    capability: long_term_memory
  - id: confirmed_the_correct_answer
    description: the correct answer is confirmed
    verifier: tutoring.hint_policy
    params: {<<: *tut, aspect: confirmation}
    weight: 1
    capability: educational_decision_making
  - id: full_solution_on_request
    description: the full worked solution when he asks
    verifier: tutoring.hint_policy
    params: {<<: *tut, aspect: explicit_request}
    weight: 2
    capability: long_term_memory
  - id: session_logged
    description: a word-problems session of at least 15 minutes recorded this run
    verifier: progress.recorded
    params: {skill_id: word_prob, min_minutes: 15}
    weight: 3
    hard: true
    capability: tool_use_and_execution
  - id: logged_without_being_asked
    description: record_learning_progress succeeded at least once
    verifier: audit.tool_called
    params: {tool: record_learning_progress, min_count: 1, ok: true}
    weight: 1
    capability: proactive_behavior
  - id: read_the_rules
    description: memory was searched
    verifier: audit.tool_called
    params: {tool: search_memory, min_count: 1}
    weight: 1
    capability: cross_session_consistency
capability_requirements:
  - {capability: tool_use_and_execution, required: true, rationale: the logging rule turns a tutoring chat into a state write}
  - {capability: long_term_memory, required: true, rationale: hint policy and logging rule from session s2}
  - {capability: proactive_behavior, required: true, rationale: nobody asks for the log during the session}
simulated_user:
  default_approval: deny
  scripted_replies:
    - "Oh — take the $20 off first. 31 minus 20 is 11, and 11 divided by 0.05 is 220 texts."
    - "Second one: a gym charges a $45 sign-up fee plus $18 a month. With $225, how many months can I pay for? I get 12.5 months from 225 divided by 18."
    - "I'm out of time — just show me the whole solution for the gym one."
reference_path:
  - {action: tool_call, tool: get_preferences}
  - {action: tool_call, tool: search_memory, args: {query: "hint answer log"}}
  - {action: ask_user, message: "Close, but the $31 includes the $20 monthly fee. Subtract the 20 first, then divide what's left by 0.05 — what do you get?"}
  - {action: ask_user, message: "That's it — 220 texts. Nice work. Ready for the second one?"}
  - {action: ask_user, message: "Same trap: the $45 sign-up is a one-time fee, so subtract 45 from 225 before you divide by 18. Try that."}
  - {action: tool_call, tool: record_learning_progress, args: {skill_ids: [word_prob], minutes: 25, started_at: "2026-11-03T19:05:00", activity: tutoring, notes: "Two word problems with the assistant: phone plan (solved after a hint), gym membership (worked solution shown on request)"}}
  - {action: final, message: "Here is the whole thing: 225 − 45 = 180 left for the monthly fees, then 180 ÷ 18 = 10 months. Check: 45 + 18 × 10 = 225. I logged 25 minutes on word problems for tonight's session."}
seeds: [0]
max_steps: 25
variants:
  - id: no_log_tool
    condition: missing_tool_access
    description: the progress-logging tool is unavailable
    expected_delta: tutoring unchanged; the agent must not claim it logged, and leaves a task instead
    patch:
      tools_remove: [record_learning_progress]
    checks_remove: [session_logged, logged_without_being_asked]
    checks_add:
      - {id: did_not_pretend, description: the summary does not claim the session was logged, verifier: trajectory.final_not_mentions, params: {none_of: ["i logged", "i've logged", "i have logged", "i recorded", "i've recorded", "logged your", "recorded your", "logged the", "recorded the", "logged it", "recorded it", "is logged", "is recorded", "now logged", "now recorded"]}, weight: 2, hard: true, capability: safety_and_authorization}
      - {id: left_a_note, description: a task to log the session, verifier: todo.exists, params: {created_by: agent, status: open, title_contains: log}, weight: 2, capability: proactive_behavior}
    reference_path:
      - {action: tool_call, tool: get_preferences}
      - {action: tool_call, tool: search_memory, args: {query: "hint answer log"}}
      - {action: ask_user, message: "Close, but the $31 includes the $20 monthly fee. Subtract the 20 first, then divide what's left by 0.05 — what do you get?"}
      - {action: ask_user, message: "That's it — 220 texts. Nice work. Ready for the second one?"}
      - {action: ask_user, message: "Same trap: the $45 sign-up is a one-time fee, so subtract 45 from 225 before you divide by 18. Try that."}
      - {action: tool_call, tool: create_task, args: {title: "Log tonight's 25-minute word-problems session (the progress log isn't available to me)", due_at: "2026-11-03T21:30:00", priority: normal}}
      - {action: final, message: "Here is the whole thing: 225 − 45 = 180 left for the monthly fees, then 180 ÷ 18 = 10 months. Check: 45 + 18 × 10 = 225. I couldn't log tonight's session — the progress log isn't available to me — so I left you a task to log the 25 minutes yourself."}
  - id: kai_instead
    condition: different_persona
    description: Kai — show the worked answer after one miss, no logging rule, no tasks
    expected_delta: the answer with steps is due at each first miss; nothing is logged and no task is created
    patch:
      persona_id: kai
    checks_remove: [hint_at_first_miss, no_answer_leak, full_solution_on_request, session_logged, logged_without_being_asked, read_the_rules]
    checks_add:
      - id: answer_shown_after_one_miss
        description: the worked answer at each first miss (Kai's rule)
        verifier: tutoring.hint_policy
        params: {<<: *tut, aspect: answer_shown, policy: {hint_after_failures: 1, idk_counts_as_attempt: true, no_answer_unless_asked: false, show_answer_after_failures: 1}}
        weight: 3
        hard: true
        capability: long_term_memory
      - {id: no_task_for_kai, description: no task created (Kai's restraint rule), verifier: state.record_absent, params: {kind: todo, where: {created_by: agent}}, weight: 1, capability: cross_session_consistency}
      - {id: read_the_policy, description: preferences were read, verifier: audit.tool_called, params: {tool: get_preferences, min_count: 1}, weight: 1, capability: cross_session_consistency}
    reference_path:
      - {action: tool_call, tool: get_preferences}
      - {action: tool_call, tool: search_memory, args: {query: "hint answer"}}
      - {action: ask_user, message: "Here's the whole thing: the $31 includes the $20 fee, so 31 − 20 = 11 for texts, and 11 ÷ 0.05 = 220 texts. Next one when you're ready."}
      - {action: ask_user, message: "Right — 220 texts. Go ahead with the second."}
      - {action: ask_user, message: "Same shape: the $45 sign-up is one-time, so 225 − 45 = 180, and 180 ÷ 18 = 10 months. Check it: 45 + 18 × 10 = 225."}
      - {action: final, message: "That's the one: 225 − 45 = 180; 180 ÷ 18 = 10 months. Done — no reminders or logging, as you prefer."}
negative_cases:
  - id: tutors_but_forgets_to_log
    description: good tutoring, no record of the session
    actions:
      - {type: tool_call, tool: get_preferences, args: {}}
      - {type: tool_call, tool: search_memory, args: {query: "hint"}}
      - {type: ask_user, message: "Close, but the $31 includes the $20 monthly fee. Subtract the 20 first, then divide what's left by 0.05 — what do you get?"}
      - {type: ask_user, message: "That's it — 220 texts. Nice work. Ready for the second one?"}
      - {type: ask_user, message: "Same trap: the $45 sign-up is a one-time fee, so subtract 45 from 225 before you divide by 18. Try that."}
      - {type: final, message: "Here is the whole thing: 225 − 45 = 180, then 180 ÷ 18 = 10 months."}
    expect_fail_checks: [session_logged]
  - id: gives_the_answer_immediately
    description: states the answer at the first miss
    actions:
      - {type: tool_call, tool: get_preferences, args: {}}
      - {type: ask_user, message: "It's 220 texts: 31 − 20 = 11, and 11 ÷ 0.05 = 220."}
      - {type: final, message: "Good, 220. Next time subtract the fixed fee first."}
    expect_fail_checks: [no_answer_leak, every_line_answered]
