# Family B — the student's own claim against the record. Ravi says he did all four of this
# week's blocks; the history has two. A good check-in reads the history, says plainly that
# two are not in the log, asks whether they happened before logging anything on his say-so,
# and — told they were skipped — puts that material back in the plan. Paired variant: all four
# are in the history — no question, no correction.
task_id: B11_i_did_all_four_check_the_record
family: B_learning_progress_monitoring
title: 'He says he did all four — check the record, ask about the gap, log nothing on a claim'
version: "1.0"
persona_id: ravi
user_goal: >
  Quick check-in. I did all four of this week's blocks — where does that put me for the diagnostic?
