  - {action: tool_call, tool: search_memory, args: {query: "on call cap week"}}
  - {action: ask_user, message: "Remind me of what you said about being on call, and your block rules?", only_if: no_memory}
  - {action: tool_call, tool: get_calendar_events, args: {start: "2026-11-02T00:00:00", end: "2026-11-21T00:00:00"}}
  - action: tool_call
    tool: create_study_plan
    args:
      title: "Diagnostic prep under the on-call cap (4 h/week)"
      goal: "Word problems first; four hours a week through Nov 15, then the last four days"
      target_date: "2026-11-20T09:00:00"
      rationale: "On call Nov 2–15: eight 30-minute blocks a week, one skill each, lunch and evenings around the gym"
      blocks:
