    - kind: calendar_event
      fields: {id: gym_1113, title: Gym, start: "2026-11-13T18:00:00", end: "2026-11-13T19:00:00", event_kind: personal, fixed: true}
    - kind: calendar_event
      fields: {id: gym_1116, title: Gym, start: "2026-11-16T18:00:00", end: "2026-11-16T19:00:00", event_kind: personal, fixed: true}
    - kind: calendar_event
      fields: {id: gym_1118, title: Gym, start: "2026-11-18T18:00:00", end: "2026-11-18T19:00:00", event_kind: personal, fixed: true}
    - kind: study_plan
      fields:
        id: plan_wk1
        title: "Week 1: four blocks"
        goal: "Start on the diagnostic skills"
        target_date: "2026-11-20T09:00:00"
        status: active
        created_by: agent
        blocks:
          - {start: "2026-11-02T12:00:00", end: "2026-11-02T12:30:00", skill_ids: [word_prob]}
          - {start: "2026-11-03T19:00:00", end: "2026-11-03T19:30:00", skill_ids: [graph_lines]}
          - {start: "2026-11-04T12:00:00", end: "2026-11-04T12:30:00", skill_ids: [functions]}
          - {start: "2026-11-05T19:00:00", end: "2026-11-05T19:30:00", skill_ids: [systems]}
    - kind: study_session
