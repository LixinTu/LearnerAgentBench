[project]
name = "learneragentbench"
version = "0.1.0.dev0"
description = "LearnerAgentBench: evaluating agents that act for a student across sessions, events and authorization boundaries in a persistent simulated learning environment."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Lixin Tu", email = "ltu35@gatech.edu" }]
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "networkx>=3.2",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pyright>=1.1.380", "hypothesis>=6.100"]
llm = ["openai>=1.40"]
analysis = ["pandas>=2.2", "pyarrow>=15", "matplotlib>=3.8"]

[project.scripts]
lab = "learneragentbench.harness.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learneragentbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["e2e: end-to-end runs (may be slow)", "llm: needs a local or remote language model"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
