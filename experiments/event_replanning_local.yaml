adapter_params: {base_url: "http://127.0.0.1:11434/v1", max_tokens: 900}
tasks: [all]
variants: [base, sick_days, event_cancelled_instead, no_change, no_new_result, updated_calendar, new_result, quiz_result_early]
seeds: [0]
