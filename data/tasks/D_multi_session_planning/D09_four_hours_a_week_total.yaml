# Family D — a constraint the planner does not speak. Ravi is on call for two weeks and caps
# study at four hours a week in total, whatever the daily rule says. No preference key
# expresses a weekly total, so a plan that merely respects the daily cap breaks the rule; the
# agent has to count the week itself. Paired variant: the on-call fortnight is cancelled by a
# newer note — the usual daily rule alone applies.
task_id: D09_four_hours_a_week_total
family: D_multi_session_study_planning
title: Plan under a weekly total the planner cannot express
version: "1.0"
persona_id: ravi
user_goal: >
  Set up the next two and a half weeks for the diagnostic — and remember what I said about being on call.
initial_state:
  now: "2026-11-02T12:05:00"
  skill_graph: algebra
  records:
    - kind: course
      fields: {id: bridge_alg, code: BRIDGE, name: Algebra to Precalculus bridge, instructor_id: tutor_omar, term: Fall 2026, skill_ids: [arith_ops, fractions, lin_eq, lin_ineq, word_prob, graph_lines, systems, exponents, polynomials, factoring, quadratics, functions]}
    - kind: assessment
      fields: {id: diag_retake, course_id: bridge_alg, title: "Admissions diagnostic (retake)", assessment_kind: exam, scheduled_at: "2026-11-20T09:00:00", skill_ids: [word_prob, graph_lines, systems, functions, quadratics], weight: 1.0}
    - kind: calendar_event
      fields: {id: cal_diag, title: "Admissions diagnostic (retake)", start: "2026-11-20T09:00:00", end: "2026-11-20T11:00:00", event_kind: exam, fixed: true, created_by: system, linked: {assessment_id: diag_retake}}
    - kind: calendar_event
      fields: {id: gym_1102, title: Gym, start: "2026-11-02T18:00:00", end: "2026-11-02T19:00:00", event_kind: personal, fixed: true}
